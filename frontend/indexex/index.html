<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia da Cidade</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- ==========================
       Cabeçalho
  ========================== -->
  <header>
    <div class="logo">
      <img src="../fotos/logo2.png" alt="Logo do Guia da Cidade">
    </div>
    <nav>
      <ul>
        <li><a href="indexex.html">Início</a></li>
        <li><a href="#">Categorias</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Contato</a></li>
        <li><a href="../login/login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- ==========================
       Seção de Destaques / Banner
  ========================== -->
  <section class="banner">
    <h2>Encontre os melhores estabelecimentos da sua cidade</h2>
    <p>Busque por restaurantes, lojas, serviços e muito mais.</p>
  </section>

  <!-- ==========================
       Seção de Lista
  ========================== -->
  <section class="lista">
    <!-- Filtros -->
    <div class="filtros">
      <input type="text" id="txtProcurar" placeholder="Pesquisar..."
        onkeydown="if(event.key === 'Enter') buscarEstabelecimentos()">
    </div>

    <!-- Cards -->
    <div class="cards">
      <!-- Cards dos estabelecimentos serão adicionados aqui via JS -->
    </div>
  </section>

  <!-- ==========================
       Rodapé
  ========================== -->
  <footer>
    <p>&copy; 2025 Guia da Cidade. Todos os direitos reservados.</p>
  </footer>
  <script src="index.js">

  </script>
</body>

</html>
